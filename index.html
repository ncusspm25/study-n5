<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>旅遊日語 N5 · 邊玩邊學</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+TC:wght@500;700&display=swap');

        :root {
            --green: #58cc02;
            --green-dark: #46a302;
            --green-light: #d7ffb8;
            --blue: #1cb0f6;
            --blue-dark: #0a91d3;
            --purple: #ce82ff;
            --purple-dark: #a560d8;
            --orange: #ff9600;
            --orange-dark: #e08600;
            --pink: #ff86d0;
            --red: #ff4b4b;
            --red-light: #ffdfe0;
            --yellow: #ffc800;
            --yellow-dark: #e0a800;
            --gray: #e5e5e5;
            --gray-dark: #afafaf;
            --text: #3c3c3c;
            --text-light: #777;
            --white: #ffffff;
            --bg: #f7f7f7;
            --shadow: 0 4px 0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        .jp { font-family: 'Noto Sans JP', sans-serif; }

        /* ========================================================
           HOME SCREEN
        ======================================================== */
        #home-screen {
            flex: 1;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px 60px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        #home-screen.hidden { display: none; }

        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
        }
        .home-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--text);
        }
        .home-title .accent {
            color: var(--green);
        }
        .home-subtitle {
            font-size: 13px;
            color: var(--text-light);
            font-weight: 700;
            margin-top: 2px;
        }

        .stats-row {
            display: flex;
            gap: 10px;
        }
        .stat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            border: 2px solid var(--gray);
            border-radius: 999px;
            padding: 6px 12px;
            font-weight: 800;
            font-size: 14px;
            color: var(--text);
        }
        .stat-pill .icon { font-size: 16px; }
        .stat-pill.streak { color: var(--orange); border-color: #ffe0b3; background: #fff7ec; }
        .stat-pill.xp { color: var(--yellow-dark); border-color: #fff0b3; background: #fffaea; }

        .section-title {
            font-size: 14px;
            font-weight: 900;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0 4px;
            margin-bottom: 4px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 540px) {
            .category-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .cat-card {
            background: white;
            border: 2px solid var(--gray);
            border-radius: 16px;
            padding: 18px 14px 16px;
            cursor: pointer;
            box-shadow: var(--shadow) #e0e0e0;
            transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 130px;
            position: relative;
            overflow: hidden;
        }
        .cat-card:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #e0e0e0;
        }
        .cat-card .cat-icon {
            font-size: 36px;
            line-height: 1;
        }
        .cat-card .cat-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
        }
        .cat-card .cat-count {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 700;
            margin-top: auto;
        }
        .cat-card .cat-progress {
            height: 6px;
            background: var(--gray);
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
        }
        .cat-card .cat-progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 3px;
            transition: width 0.4s;
        }
        .cat-card[data-color="blue"]    { border-color: #c2eaff; box-shadow: var(--shadow) #c2eaff; }
        .cat-card[data-color="orange"]  { border-color: #ffe0b3; box-shadow: var(--shadow) #ffe0b3; }
        .cat-card[data-color="purple"]  { border-color: #efd9ff; box-shadow: var(--shadow) #efd9ff; }
        .cat-card[data-color="pink"]    { border-color: #ffd1ec; box-shadow: var(--shadow) #ffd1ec; }
        .cat-card[data-color="green"]   { border-color: #d2f3a4; box-shadow: var(--shadow) #d2f3a4; }
        .cat-card[data-color="red"]     { border-color: #ffd1d1; box-shadow: var(--shadow) #ffd1d1; }
        .cat-card[data-color="yellow"]  { border-color: #ffe896; box-shadow: var(--shadow) #ffe896; }

        .info-banner {
            background: linear-gradient(135deg, #58cc02 0%, #1cb0f6 100%);
            color: white;
            border-radius: 16px;
            padding: 18px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.08);
        }
        .info-banner .ico { font-size: 36px; line-height: 1; }
        .info-banner .txt-title { font-size: 16px; font-weight: 900; }
        .info-banner .txt-sub { font-size: 13px; font-weight: 600; opacity: 0.95; margin-top: 2px; }

        /* ========================================================
           QUIZ SCREEN
        ======================================================== */
        #quiz-screen {
            flex: 1;
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }
        #quiz-screen.show { display: flex; }

        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: white;
            border-bottom: 2px solid var(--gray);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .close-btn {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            color: var(--gray-dark);
            font-size: 22px;
            font-weight: 900;
            flex-shrink: 0;
        }
        .close-btn:active { background: var(--gray); }

        .progress-bar-wrap {
            flex: 1;
            height: 14px;
            background: var(--gray);
            border-radius: 7px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--green);
            border-radius: 7px;
            transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
            position: relative;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 2px; left: 4px; right: 4px;
            height: 4px;
            background: rgba(255,255,255,0.4);
            border-radius: 2px;
        }

        .hearts {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
            align-items: center;
            color: var(--red);
            font-weight: 900;
        }
        .heart-emoji {
            font-size: 20px;
            margin-right: 2px;
        }
        .heart-num { font-size: 16px; }

        .quiz-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 200px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .type-label {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .instruction {
            font-size: 22px;
            font-weight: 900;
            color: var(--text);
            align-self: flex-start;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .question-card {
            background: white;
            border: 2px solid var(--gray);
            border-radius: 16px;
            padding: 28px 22px 24px;
            width: 100%;
            margin-bottom: 24px;
            text-align: center;
            position: relative;
        }

        .question-kana {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .question-kanji {
            font-size: 44px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .question-meaning {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.3;
        }

        /* Speak button */
        .speak-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--blue);
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--blue-dark);
        }
        .speak-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--blue-dark);
        }
        .speak-btn.big {
            position: static;
            width: 90px;
            height: 90px;
            font-size: 44px;
            margin: 16px auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 var(--blue-dark);
        }

        /* Grammar fill blank */
        .question-grammar {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.6;
        }
        .fill-blank {
            display: inline-block;
            min-width: 70px;
            border-bottom: 4px solid var(--blue);
            padding: 0 10px;
            color: var(--blue);
            font-weight: 900;
            margin: 0 2px;
        }
        .fill-blank.filled { color: var(--green); border-bottom-color: var(--green); }
        .grammar-desc {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 12px;
            font-weight: 700;
        }
        .grammar-reading {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
            font-weight: 600;
            font-style: italic;
        }

        /* Phrase question */
        .phrase-zh {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .phrase-tip {
            font-size: 13px;
            color: var(--text-light);
            font-weight: 700;
        }

        /* ========================================================
           OPTIONS
        ======================================================== */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
        .options.single-col { grid-template-columns: 1fr; }
        @media (max-width: 380px) {
            .options { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: white;
            border: 2px solid var(--gray);
            border-radius: 14px;
            padding: 14px 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.1s, transform 0.1s, box-shadow 0.1s;
            box-shadow: var(--shadow) #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            min-height: 64px;
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #e0e0e0;
        }
        .option-btn .badge {
            min-width: 26px;
            height: 26px;
            border-radius: 6px;
            background: white;
            border: 2px solid var(--gray);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
            color: var(--text-light);
        }
        .option-btn.selected {
            border-color: var(--blue);
            box-shadow: var(--shadow) var(--blue-dark);
            background: #ddf4ff;
        }
        .option-btn.selected .badge { background: var(--blue); color: white; border-color: var(--blue); }

        .option-btn.correct {
            border-color: var(--green);
            background: var(--green-light);
            box-shadow: var(--shadow) var(--green-dark);
            color: var(--green-dark);
        }
        .option-btn.correct .badge { background: var(--green); color: white; border-color: var(--green); }

        .option-btn.wrong {
            border-color: var(--red);
            background: var(--red-light);
            box-shadow: var(--shadow) #c03434;
            color: var(--red);
        }
        .option-btn.wrong .badge { background: var(--red); color: white; border-color: var(--red); }

        .option-btn:disabled { cursor: default; }

        .option-btn .opt-main {
            font-weight: 800;
            font-size: 17px;
        }
        .option-btn .opt-sub {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 600;
            margin-top: 2px;
        }

        /* ========================================================
           BOTTOM BAR
        ======================================================== */
        .bottom-area {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            border-top: 2px solid var(--gray);
            padding: 14px 16px;
            z-index: 50;
        }

        .feedback-msg {
            display: none;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            padding: 4px 0;
        }
        .feedback-msg.visible { display: flex; }
        .feedback-msg.correct-msg { color: var(--green-dark); }
        .feedback-msg.wrong-msg { color: var(--red); }

        .feedback-icon {
            font-size: 36px;
            flex-shrink: 0;
        }
        .feedback-text { flex: 1; }
        .feedback-title { font-size: 18px; font-weight: 900; }
        .feedback-answer { font-size: 14px; font-weight: 700; margin-top: 2px; color: var(--text); }
        .feedback-answer .jp-ans { font-weight: 900; }

        .action-row {
            display: flex;
            gap: 10px;
        }
        .btn-check, .btn-continue, .btn-skip {
            height: 52px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            border: none;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            letter-spacing: 0.04em;
        }
        .btn-check {
            flex: 1;
            background: var(--green);
            color: white;
            box-shadow: var(--shadow) var(--green-dark);
        }
        .btn-check:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dark); }
        .btn-check:disabled { background: var(--gray); color: var(--gray-dark); box-shadow: var(--shadow) #ccc; cursor: default; }

        .btn-continue {
            flex: 1;
            background: var(--green);
            color: white;
            box-shadow: var(--shadow) var(--green-dark);
        }
        .btn-continue.red {
            background: var(--red);
            box-shadow: var(--shadow) #c03434;
        }
        .btn-continue:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dark); }
        .btn-continue.red:active { box-shadow: 0 1px 0 #c03434; }

        .btn-skip {
            padding: 0 18px;
            background: transparent;
            color: var(--gray-dark);
            border: 2px solid var(--gray);
        }
        .btn-skip:active { background: var(--gray); }

        /* ========================================================
           COMPLETE SCREEN
        ======================================================== */
        #complete-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px 20px;
            text-align: center;
            gap: 20px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            min-height: 100vh;
        }
        #complete-screen.show { display: flex; }

        .trophy { font-size: 90px; animation: bounce 0.6s ease; }
        @keyframes bounce {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .complete-title {
            font-size: 30px;
            font-weight: 900;
            color: var(--green-dark);
        }
        .complete-sub {
            font-size: 15px;
            color: var(--text-light);
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
        .stat-card {
            background: white;
            border: 2px solid var(--gray);
            border-radius: 14px;
            padding: 14px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .stat-icon { font-size: 28px; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--text); }
        .stat-label { font-size: 11px; font-weight: 800; color: var(--text-light); }

        .complete-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .btn-restart, .btn-home {
            border: none;
            border-radius: 14px;
            height: 54px;
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-restart {
            background: var(--green);
            color: white;
            box-shadow: var(--shadow) var(--green-dark);
        }
        .btn-restart:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dark); }
        .btn-home {
            background: white;
            color: var(--text);
            border: 2px solid var(--gray);
            box-shadow: var(--shadow) #e0e0e0;
        }
        .btn-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #e0e0e0; }

        /* ========================================================
           POPUPS / EFFECTS
        ======================================================== */
        .xp-popup {
            position: fixed;
            font-size: 18px;
            font-weight: 900;
            color: var(--yellow-dark);
            pointer-events: none;
            z-index: 999;
            animation: floatUp 1s ease forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }

        .streak-flash {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(88,204,2,0.15);
            pointer-events: none;
            z-index: 100;
        }
        @keyframes flashGreen {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes shakeHeart {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            60% { transform: translateX(5px); }
        }
        .heart-emoji.shake { animation: shakeHeart 0.4s ease; }

        /* ========================================================
           FOOTER
        ======================================================== */
        .home-footer {
            text-align: center;
            font-size: 12px;
            color: var(--gray-dark);
            font-weight: 700;
            padding: 16px 0 8px;
        }
    </style>
</head>
<body>

<!-- ============================================================
     HOME SCREEN
============================================================ -->
<div id="home-screen">
    <div class="home-header">
        <div>
            <div class="home-title">旅遊<span class="accent">日語</span> N5</div>
            <div class="home-subtitle">為旅行而學・每天一點點</div>
        </div>
        <div class="stats-row">
            <div class="stat-pill streak"><span class="icon">🔥</span><span id="streak-num">0</span></div>
            <div class="stat-pill xp"><span class="icon">⭐</span><span id="total-xp">0</span></div>
        </div>
    </div>

    <div class="info-banner">
        <div class="ico">🗾</div>
        <div>
            <div class="txt-title">準備去日本玩了嗎？</div>
            <div class="txt-sub">用最常見的單字 + 文法 + 短句，輕鬆應付旅遊現場！</div>
        </div>
    </div>

    <div class="section-title">🧳 旅遊主題單字</div>
    <div class="category-grid" id="travel-grid"></div>

    <div class="section-title">📖 文法練習</div>
    <div class="category-grid" id="grammar-grid"></div>

    <div class="section-title">💬 旅遊實用短句</div>
    <div class="category-grid" id="phrase-grid"></div>

    <div class="section-title">🌸 N5 基礎單字</div>
    <div class="category-grid" id="basic-grid"></div>

    <div class="home-footer">N5 ・ 為旅遊打造的學習工具 ・ 點選分類開始學習</div>
</div>

<!-- ============================================================
     QUIZ SCREEN
============================================================ -->
<div id="quiz-screen">
    <div class="topbar">
        <div class="close-btn" onclick="goHome()">✕</div>
        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
        <div class="hearts">
            <span class="heart-emoji" id="heart-emoji">❤️</span>
            <span class="heart-num" id="hearts-num">5</span>
        </div>
    </div>

    <div class="quiz-main" id="quiz-area">
        <div class="type-label" id="type-label"></div>
        <div class="instruction" id="instruction"></div>
        <div class="question-card" id="question-card"></div>
        <div class="options" id="options"></div>
    </div>

    <div class="bottom-area" id="bottom-area">
        <div class="feedback-msg" id="feedback-msg">
            <span class="feedback-icon" id="feedback-icon"></span>
            <div class="feedback-text">
                <div class="feedback-title" id="feedback-title"></div>
                <div class="feedback-answer" id="feedback-answer"></div>
            </div>
        </div>
        <div class="action-row" id="action-row">
            <button class="btn-skip" onclick="skipQuestion()">跳過</button>
            <button class="btn-check" id="btn-check" disabled onclick="checkAnswer()">確認</button>
        </div>
    </div>
</div>

<!-- ============================================================
     COMPLETE SCREEN
============================================================ -->
<div id="complete-screen">
    <div class="trophy">🏆</div>
    <div class="complete-title" id="complete-title">太厲害了！</div>
    <div class="complete-sub" id="complete-sub">你完成了一回合練習</div>

// ============================================================
// CATEGORY REGISTRY
// ============================================================
const TRAVEL_CATS = [
    TRAVEL.airport, TRAVEL.restaurant, TRAVEL.hotel, TRAVEL.shopping,
    TRAVEL.direction, TRAVEL.emergency, TRAVEL.time, TRAVEL.greeting
];
const GRAMMAR_CATS = [GRAMMAR_PARTICLES, GRAMMAR_PATTERNS, GRAMMAR_ADJ];
const PHRASE_CATS = [PHRASES_TRAVEL];
const BASIC_CATS = [BASIC_DAILY, BASIC_VERBS, BASIC_ADJ];

const ALL_CATS = [...TRAVEL_CATS, ...GRAMMAR_CATS, ...PHRASE_CATS, ...BASIC_CATS];

// 用來標記類型 (vocab / grammar-particle / grammar-pattern / grammar-adj / phrase)
function categoryType(cat) {
    if (cat === GRAMMAR_PARTICLES) return 'grammar-particle';
    if (cat === GRAMMAR_PATTERNS) return 'grammar-pattern';
    if (cat === GRAMMAR_ADJ) return 'grammar-adj';
    if (cat === PHRASES_TRAVEL) return 'phrase';
    return 'vocab';
}

// ============================================================
// STORAGE
// ============================================================
const STORAGE_KEY = 'jp-travel-n5-v1';
function loadProgress() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch(e) { return {}; }
}
function saveProgress(p) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e) {}
}
function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function updateStreak(p) {
    const today = todayKey();
    if (p.lastDay === today) return p;
    // 計算昨天
    const yest = new Date();
    yest.setDate(yest.getDate() - 1);
    const yestKey = `${yest.getFullYear()}-${yest.getMonth()+1}-${yest.getDate()}`;
    if (p.lastDay === yestKey) p.streak = (p.streak || 0) + 1;
    else p.streak = 1;
    p.lastDay = today;
    saveProgress(p);
    return p;
}

let progress = loadProgress();
progress.xp = progress.xp || 0;
progress.streak = progress.streak || 0;
progress.catProgress = progress.catProgress || {};
saveProgress(progress);

// ============================================================
// HOME RENDERING
// ============================================================
function renderHome() {
    document.getElementById('streak-num').textContent = progress.streak || 0;
    document.getElementById('total-xp').textContent = progress.xp || 0;

    renderCategoryGrid('travel-grid', TRAVEL_CATS);
    renderCategoryGrid('grammar-grid', GRAMMAR_CATS);
    renderCategoryGrid('phrase-grid', PHRASE_CATS);
    renderCategoryGrid('basic-grid', BASIC_CATS);
}

function renderCategoryGrid(id, cats) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    cats.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'cat-card';
        card.dataset.color = cat.color;
        const cp = progress.catProgress[cat.id] || {best: 0, played: 0};
        const pct = cp.best ? Math.min(100, cp.best) : 0;
        card.innerHTML = `
            <div class="cat-icon">${cat.icon}</div>
            <div class="cat-name">${cat.name}</div>
            <div class="cat-count">${cat.items.length} 個 ・ 練習 ${cp.played} 次</div>
            <div class="cat-progress"><div class="cat-progress-fill" style="width:${pct}%"></div></div>
        `;
        card.onclick = () => startQuiz(cat);
        el.appendChild(card);
    });
}

// ============================================================
// QUIZ ENGINE
// ============================================================
const TOTAL_QUESTIONS = 12;
const MAX_HEARTS = 5;
const XP_PER_CORRECT = 10;

let currentCat = null;
let currentType = null;
let queue = [];
let currentQ = null;
let selectedOption = null;
let hearts = MAX_HEARTS;
let xp = 0;
let answered = 0;
let correctCount = 0;
let state = 'waiting';
let questionsDone = 0;

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function startQuiz(cat) {
    currentCat = cat;
    currentType = categoryType(cat);
    const total = Math.min(TOTAL_QUESTIONS, cat.items.length);
    queue = shuffle(cat.items).slice(0, total);
    document.documentElement.style.setProperty('--question-total', total);
    window._totalQ = total;
    hearts = MAX_HEARTS;
    xp = 0;
    answered = 0;
    correctCount = 0;
    questionsDone = 0;
    selectedOption = null;
    state = 'waiting';

    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.add('show');
    document.getElementById('complete-screen').classList.remove('show');
    document.getElementById('quiz-area').style.display = 'flex';
    document.getElementById('bottom-area').style.display = 'block';

    renderHearts();
    updateProgress();
    nextQuestion();
}

function restartCurrent() {
    if (currentCat) startQuiz(currentCat);
    else goHome();
}

function goHome() {
    document.getElementById('home-screen').classList.remove('hidden');
    document.getElementById('quiz-screen').classList.remove('show');
    document.getElementById('complete-screen').classList.remove('show');
    document.getElementById('quiz-area').style.display = 'flex';
    document.getElementById('bottom-area').style.display = 'block';
    renderHome();
}

function renderHearts() {
    document.getElementById('hearts-num').textContent = Math.max(hearts, 0);
}

function updateProgress() {
    const total = window._totalQ || TOTAL_QUESTIONS;
    const pct = (questionsDone / total) * 100;
    document.getElementById('progress-bar').style.width = pct + '%';
}

function nextQuestion() {
    if (queue.length === 0 || hearts <= 0) {
        showComplete();
        return;
    }
    const item = queue.pop();
    currentQ = buildQuestion(item);
    renderQuestion(currentQ);
    resetBottomBar();
    state = 'waiting';
    selectedOption = null;
}

// 出題類型分發
function buildQuestion(item) {
    if (currentType === 'vocab') return buildVocabQ(item);
    if (currentType === 'grammar-particle') return buildParticleQ(item);
    if (currentType === 'grammar-pattern') return buildPatternQ(item);
    if (currentType === 'grammar-adj') return buildAdjQ(item);
    if (currentType === 'phrase') return buildPhraseQ(item);
    return buildVocabQ(item);
}

// === Vocab ===
function buildVocabQ(item) {
    const modes = ['k2a', 'a2k', 'r2a', 'listen'];
    const mode = modes[Math.floor(Math.random() * modes.length)];
    const all = currentCat.items.filter(v => v.k !== item.k);
    const others = shuffle(all).slice(0, 3);

    let questionHtml, instruction, options, correct;

    if (mode === 'k2a') {
        // 看日文 → 選中文
        questionHtml = `
            <button class="speak-btn" onclick="speakJp('${item.r}')">🔊</button>
            <div class="question-kana jp">${item.r}</div>
            <div class="question-kanji jp">${item.k}</div>
        `;
        instruction = '選出正確的中文意思';
        correct = item.a;
        options = shuffle([item.a, ...others.map(o => o.a)]).map(t => ({label:t, value:t}));
    } else if (mode === 'a2k') {
        // 看中文 → 選日文
        questionHtml = `<div class="question-meaning">${item.a}</div>`;
        instruction = '選出對應的日文';
        correct = item.k;
        options = shuffle([item, ...others]).map(o => ({
            label: `<div class="opt-main jp">${o.k}</div><div class="opt-sub jp">${o.r}</div>`,
            value: o.k,
            html: true
        }));
    } else if (mode === 'r2a') {
        // 看假名 → 選中文
        questionHtml = `
            <button class="speak-btn" onclick="speakJp('${item.r}')">🔊</button>
            <div class="question-kanji jp" style="font-size:34px;">${item.r}</div>
        `;
        instruction = '選出正確的中文意思';
        correct = item.a;
        options = shuffle([item.a, ...others.map(o => o.a)]).map(t => ({label:t, value:t}));
    } else {
        // 聽力 → 選中文
        questionHtml = `
            <button class="speak-btn big" onclick="speakJp('${item.r}')">🔊</button>
            <div class="grammar-desc" style="font-size:14px;">點圖示再聽一次</div>
        `;
        instruction = '聽音檔，選出意思';
        correct = item.a;
        options = shuffle([item.a, ...others.map(o => o.a)]).map(t => ({label:t, value:t}));
        // 自動播放
        setTimeout(() => speakJp(item.r), 350);
    }

    return {
        questionHtml,
        instruction,
        typeLabel: currentCat.icon + ' ' + currentCat.name,
        options,
        correct,
        explainAnswer: `${item.k} (${item.r}) = ${item.a}`,
        item
    };
}

// === Grammar - 助詞填空 ===
function buildParticleQ(item) {
    const allParticles = ['は','が','を','に','へ','で','と','から','まで','の','も'];
    const others = shuffle(allParticles.filter(p => p !== item.ans)).slice(0, 3);
    const opts = shuffle([item.ans, ...others]);

    const questionHtml = `
        <button class="speak-btn" onclick="speakJp('${item.r.replace(/___/g,item.ans)}')">🔊</button>
        <div class="question-grammar jp">${item.pre}<span class="fill-blank">？</span>${item.post}</div>
        <div class="grammar-reading jp">${item.r}</div>
        <div class="grammar-desc">${item.desc}</div>
    `;

    return {
        questionHtml,
        instruction: '選出正確的助詞',
        typeLabel: '🔤 助詞填空',
        options: opts.map(p => ({label:`<div class="opt-main jp" style="font-size:22px;">${p}</div>`, value:p, html:true})),
        correct: item.ans,
        explainAnswer: `${item.pre}${item.ans}${item.post}`,
        item
    };
}

// === Grammar - 句型 ===
function buildPatternQ(item) {
    const opts = shuffle([item.a, ...item.distractors]);
    const questionHtml = `<div class="phrase-zh">${item.q}</div>`;
    return {
        questionHtml,
        instruction: '選出正確的日文',
        typeLabel: '📝 句型練習',
        options: opts.map(t => ({
            label: `<div class="opt-main jp" style="font-size:15px; line-height:1.4;">${t}</div>`,
            value: t, html: true
        })),
        correct: item.a,
        explainAnswer: `${item.a} (${item.r})`,
        item
    };
}

// === Grammar - 形容詞變化 ===
function buildAdjQ(item) {
    const opts = shuffle([item.a, ...item.distractors]);
    const questionHtml = `<div class="phrase-zh">${item.q}</div>`;
    return {
        questionHtml,
        instruction: '選出正確的變化',
        typeLabel: '🎨 形容詞變化',
        options: opts.map(t => ({
            label: `<div class="opt-main jp" style="font-size:18px;">${t}</div>`,
            value: t, html: true
        })),
        correct: item.a,
        explainAnswer: `${item.a} (${item.r})`,
        item
    };
}

// === 短句 ===
function buildPhraseQ(item) {
    const all = currentCat.items.filter(v => v.jp !== item.jp);
    const others = shuffle(all).slice(0, 3);

    const mode = Math.random() < 0.5 ? 'zh2jp' : 'listen2zh';

    if (mode === 'zh2jp') {
        const questionHtml = `<div class="phrase-zh">${item.zh}</div>`;
        const opts = shuffle([item, ...others]);
        return {
            questionHtml,
            instruction: '選出對應的日文短句',
            typeLabel: '💬 旅遊短句',
            options: opts.map(o => ({
                label: `<div class="opt-main jp" style="font-size:14px; line-height:1.4;">${o.jp}</div>`,
                value: o.jp, html: true
            })),
            correct: item.jp,
            explainAnswer: `${item.jp}\n(${item.r})`,
            item
        };
    } else {
        const questionHtml = `
            <button class="speak-btn big" onclick="speakJp('${item.r}')">🔊</button>
            <div class="grammar-desc" style="font-size:14px;">點圖示再聽一次</div>
        `;
        const opts = shuffle([item.zh, ...others.map(o => o.zh)]);
        setTimeout(() => speakJp(item.r), 350);
        return {
            questionHtml,
            instruction: '聽聽看，選出中文意思',
            typeLabel: '💬 旅遊短句',
            options: opts.map(t => ({label:t, value:t})),
            correct: item.zh,
            explainAnswer: `${item.jp} = ${item.zh}`,
            item
        };
    }
}

// ============================================================
// RENDER QUESTION
// ============================================================
function renderQuestion(q) {
    document.getElementById('type-label').textContent = q.typeLabel;
    document.getElementById('instruction').textContent = q.instruction;
    document.getElementById('question-card').innerHTML = q.questionHtml;

    const optEl = document.getElementById('options');
    const labels = ['A','B','C','D'];
    optEl.innerHTML = '';
    optEl.className = 'options' + (q.options.length <= 2 ? ' single-col' : '');
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        const content = opt.html ? opt.label : `<div class="opt-main">${opt.label}</div>`;
        btn.innerHTML = `<span class="badge">${labels[i]}</span><div style="flex:1; min-width:0;">${content}</div>`;
        btn.dataset.value = opt.value;
        btn.onclick = () => selectOption(btn, opt.value);
        optEl.appendChild(btn);
    });
}

function selectOption(btn, value) {
    if (state !== 'waiting') return;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedOption = value;
    document.getElementById('btn-check').disabled = false;
}

function checkAnswer() {
    if (state !== 'waiting' || selectedOption === null) return;
    state = 'answered';
    answered++;

    const isCorrect = selectedOption === currentQ.correct;

    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
        const v = btn.dataset.value;
        if (v === currentQ.correct) btn.classList.add('correct');
        else if (v === selectedOption && !isCorrect) btn.classList.add('wrong');
    });

    if (isCorrect) {
        correctCount++;
        xp += XP_PER_CORRECT;
        questionsDone++;
        showFeedback(true);
        showXpPopup();
        flashCorrect();
    } else {
        hearts--;
        renderHearts();
        shakeHeart();
        questionsDone++;
        showFeedback(false);
        // 念出正確答案
        const item = currentQ.item;
        if (item) {
            if (item.r) speakJp(item.r);
            else if (item.k) speakJp(item.k);
        }
    }

    updateProgress();
    switchToContinue(isCorrect);
}

function skipQuestion() {
    if (state === 'answered') { nextQuestion(); return; }
    state = 'answered';
    answered++;
    hearts--;
    questionsDone++;
    renderHearts();
    shakeHeart();
    updateProgress();

    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.value === currentQ.correct) btn.classList.add('correct');
    });
    showFeedback(false);
    switchToContinue(false);
}

function showFeedback(correct) {
    const msg = document.getElementById('feedback-msg');
    const icon = document.getElementById('feedback-icon');
    const title = document.getElementById('feedback-title');
    const ansEl = document.getElementById('feedback-answer');

    msg.className = 'feedback-msg visible ' + (correct ? 'correct-msg' : 'wrong-msg');
    icon.textContent = correct ? '✅' : '❌';
    title.textContent = correct ? '太棒了！答對了' : '答錯了，再加油！';
    ansEl.innerHTML = correct
        ? `+${XP_PER_CORRECT} XP <span class="jp-ans">${currentQ.explainAnswer || ''}</span>`
        : `正確答案：<span class="jp-ans">${currentQ.explainAnswer || currentQ.correct}</span>`;
}

function switchToContinue(isCorrect) {
    document.getElementById('action-row').innerHTML = `
        <button class="btn-continue ${isCorrect ? '' : 'red'}" onclick="nextQuestion()">${isCorrect ? '繼續 →' : '知道了'}</button>
    `;
}

function resetBottomBar() {
    document.getElementById('feedback-msg').className = 'feedback-msg';
    document.getElementById('action-row').innerHTML = `
        <button class="btn-skip" onclick="skipQuestion()">跳過</button>
        <button class="btn-check" id="btn-check" disabled onclick="checkAnswer()">確認</button>
    `;
}

function showXpPopup() {
    const popup = document.createElement('div');
    popup.className = 'xp-popup';
    popup.textContent = `+${XP_PER_CORRECT} XP ⭐`;
    const bar = document.getElementById('progress-bar');
    const rect = bar.getBoundingClientRect();
    popup.style.top = (rect.bottom + 10) + 'px';
    popup.style.right = '20px';
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 1000);
}

function flashCorrect() {
    const el = document.getElementById('streak-flash');
    el.style.display = 'block';
    el.style.animation = 'none';
    requestAnimationFrame(() => {
        el.style.animation = 'flashGreen 0.4s ease forwards';
    });
    setTimeout(() => { el.style.display = 'none'; }, 400);
}

function shakeHeart() {
    const heart = document.getElementById('heart-emoji');
    heart.classList.remove('shake');
    void heart.offsetWidth;
    heart.classList.add('shake');
}

function showComplete() {
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('bottom-area').style.display = 'none';

    const accuracy = answered > 0 ? Math.round((correctCount / answered) * 100) : 0;
    document.getElementById('final-xp').textContent = xp;
    document.getElementById('final-accuracy').textContent = accuracy + '%';
    document.getElementById('final-hearts').textContent = Math.max(hearts, 0);

    const allCorrect = (correctCount === answered) && answered > 0;
    document.getElementById('complete-title').textContent = hearts <= 0 ? '不要放棄！再試一次' : (allCorrect ? '完美! 🎉' : '太厲害了！');
    document.getElementById('complete-sub').textContent = `本回合：${correctCount} / ${answered} 題答對`;

    // 儲存進度
    progress.xp = (progress.xp || 0) + xp;
    progress.catProgress[currentCat.id] = progress.catProgress[currentCat.id] || {best: 0, played: 0};
    progress.catProgress[currentCat.id].played += 1;
    if (accuracy > (progress.catProgress[currentCat.id].best || 0)) {
        progress.catProgress[currentCat.id].best = accuracy;
    }
    progress = updateStreak(progress);
    saveProgress(progress);

    document.getElementById('complete-screen').classList.add('show');
    document.getElementById('quiz-screen').classList.remove('show');
}

// ============================================================
// TTS  (Web Speech API)
// ============================================================
let jpVoice = null;
function pickVoice() {
    const voices = speechSynthesis.getVoices();
    jpVoice = voices.find(v => v.lang === 'ja-JP') ||
              voices.find(v => v.lang.startsWith('ja')) ||
              null;
}
if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
}

function speakJp(text) {
    if (!('speechSynthesis' in window)) return;
    if (!text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    if (jpVoice) u.voice = jpVoice;
    u.rate = 0.95;
    u.pitch = 1;
    speechSynthesis.speak(u);
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (state === 'waiting' && !document.getElementById('btn-check')?.disabled) checkAnswer();
        else if (state === 'answered') nextQuestion();
    }
    const map = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
    if (map[e.key.toLowerCase()] !== undefined && state === 'waiting') {
        const btns = document.querySelectorAll('.option-btn');
        const idx = map[e.key.toLowerCase()];
        if (btns[idx]) btns[idx].click();
    }
});

renderHome();
</script>
